name: CI Pipeline

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read
    pull-requests: read

jobs:
    build_format_lint_test:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - name: Install dependencies
              run: |
                  go mod download
                  go mod verify

            - name: Run gofmt
              run: |
                  gofmt -s -w .
                  git diff --exit-code -- '*.go'

            - name: Validate local deployment configuration
              run: |
                  sh -n scripts/local.sh
                  cp deploy/env/local.env.example .env.local
                  docker compose --project-directory . --env-file .env.local -f deploy/compose.local.yml config --quiet

            - name: Run Golangci-lint
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  version: v2.14.0
                  args: "--timeout 5m"

            - name: Run tests
              run: |
                  go test -race -coverprofile=coverage.out ./...
                  go tool cover -func=coverage.out

            - name: Check decoder and encoder fuzz properties
              run: |
                  go test ./internal/utils -run '^$' -fuzz '^FuzzEncodeDecode$' -fuzztime=5s
                  go test ./internal/utils -run '^$' -fuzz '^FuzzDecode$' -fuzztime=5s

            - name: Upload coverage diagnostics
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: go-coverage
                  path: coverage.out
                  if-no-files-found: warn
                  retention-days: 14
