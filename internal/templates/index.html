<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial scale=1.0" />
        <title>SmallChop URL Shortener</title>
        <meta name="htmx-config" content='{"noSwap":[204,304,"4xx","5xx"]}'>
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0/dist/htmx.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    </head>
    <body class="bg-gray-100 min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h1 class="text-2xl font-bold mb-4">SmallChop URL Shortener</h1>
            <form hx-post="/shorten" hx-target="#result" hx swap="innerHTML">
                <input
                    type="url"
                    name="url"
                    placeholder="Enter URL to shorten"
                    class="w-full p-2 border rounded mb-4"
                    required
                />
                <button
                    type="submit"
                    class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600"
                >
                    Shorten URL
                </button>
            </form>
            <div id="result"></div>
        </div>
    </body>
</html>
