# Paths are repository-root relative. Run from the repository root with:
# docker compose --project-directory . --env-file .env -f deploy/docker-compose.yml ...
services:
  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    networks:
      proxy:
        ipv4_address: ${PROXY_IP:-172.30.81.2}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env

  app:
    build: .
    environment:
      TRUSTED_PROXY_IPS: ${PROXY_IP:-172.30.81.2}
    networks:
      proxy:
        ipv4_address: ${APP_PROXY_IP:-172.30.81.3}
      default: {}
    depends_on:
      - redis
      - mongo
    env_file:
      - .env

  redis:
    image: "redis:8.10.2-alpine"
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    env_file:
      - .env

  mongo:
    image: "mongo:9.0.2"
    env_file:
      - .env
    volumes:
      - mongo-data:/data/db # Persistent storage
      - ./deploy/mongo/mongo-user-init.js:/docker-entrypoint-initdb.d/mongo-user-init.js:ro # RBAC init script

volumes:
  mongo-data:
  caddy_data:
  caddy_config:

networks:
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.81.0/29}
